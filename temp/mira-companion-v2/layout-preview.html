<!doctype html>
<html lang="ja" style="--vscode-editor-background:#1f1f24;--vscode-foreground:#eeeeee;--vscode-descriptionForeground:#b4b4b4;--vscode-badge-foreground:#ffffff;--vscode-badge-background:#4c5264;--vscode-focusBorder:#67c4dd;--vscode-font-family:system-ui,sans-serif">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../../extensions/mira-companion/media/world.css">
</head>
<body>
  <main id="world" class="world" data-status="typing" data-day-phase="day" style="--mira-x:52;--travel-ms:0ms">
    <img class="world__map" src="../../assets/mira/worlds/workshop.png" alt="">
    <div class="world__shade"></div>
    <div class="decorations">
      <i class="decoration decoration--sticker is-visible"></i>
      <i class="decoration decoration--lanterns is-visible"></i>
      <i class="decoration decoration--signal is-visible"></i>
      <i class="decoration decoration--pennant is-visible"></i>
    </div>
    <div class="companions">
      <span class="companion" style="left:77%"><img src="../../assets/mira/sprites/companions/researcher-inspect.png" alt=""></span>
      <span class="companion" style="left:81%"><img src="../../assets/mira/sprites/companions/implementer-type.png" alt=""></span>
    </div>
    <div class="mira"><img src="../../assets/mira/sprites/work-actions/typing-01.png" alt=""></div>
    <button class="earned-pop" type="button">ひと区切り！</button>
    <div class="hud">
      <span class="hud__status">実装中</span>
      <span class="hud__line">形にしてる途中〜</span>
      <span class="hud__session">調査3 · 編集8 · test2</span>
      <span class="hud__progress">Lv.4 · 38/62 · ✦4</span>
    </div>
  </main>
</body>
</html>
