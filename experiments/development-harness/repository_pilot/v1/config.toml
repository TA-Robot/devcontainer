approval_policy = "never"
default_permissions = "pilot"
web_search = "disabled"
allow_login_shell = false
check_for_update_on_startup = false
model = "gpt-6-astra"
model_reasoning_effort = "high"
model_catalog_json = "/control/catalog.json"

[features]
apps = false
plugins = false
remote_plugin = false
browser_use = false
computer_use = false
image_generation = false
multi_agent = false
hooks = false
memories = false
goals = false
sleep_tool = false
skill_search = false
shell_snapshot = false
shell_tool = true
unified_exec = true
code_mode = true
code_mode_host = true

[permissions.pilot]
extends = ":workspace"
[permissions.pilot.filesystem]
":root" = "deny"
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
"/usr/local" = "read"
[permissions.pilot.filesystem.":workspace_roots"]
"." = "write"
[permissions.pilot.network]
enabled = false

[shell_environment_policy]
inherit = "none"
ignore_default_excludes = false
set = { PATH = "/usr/local/bin:/usr/bin:/bin", HOME = "/tmp", LANG = "C.UTF-8", LC_ALL = "C.UTF-8", TZ = "UTC", PYTHONDONTWRITEBYTECODE = "1", PYTHONPATH = "/app/lib:/app" }
[history]
persistence = "none"
[memories]
generate_memories = false
use_memories = false
